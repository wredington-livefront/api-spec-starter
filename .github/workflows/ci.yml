name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code dist/bundle.yaml || (echo "Error: dist/bundle.yaml has uncommitted changes. Please run 'npm run build' and commit the updated file." && exit 1)
