# See https://redocly.com/docs/cli/configuration/ for more information.
apis:
  sample@v1: 
    root: api/v1/root.yaml
extends:
  - recommended
rules:
  no-unused-components: error
  no-server-example.com: off
theme:
  openapi:
    htmlTemplate: ./docs/index.html
    theme:
      colors:
        primary:
          main: "#32329f"
    schemaDefinitionsTagName: Schemas 
    generateCodeSamples:
      languages:  
        - lang: curl
        - lang: Node.js
        - lang: JavaScript
