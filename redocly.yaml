# See https://redocly.com/docs/cli/configuration/ for more information.
apis:
  sample@v1: 
    root: api/v1/root.yaml

extends:
  - recommended

plugins: 
  -  './plugins/rules/custom-rules.js'

rules:
  info-license: off
  operation-operationId: off
  operation-4xx-response: off
  custom-rules/x-based-on-validator: error
  
theme:
  openapi:
    htmlTemplate: ./docs/index.html
    theme:
      colors:
        primary:
          main: "#32329f"
    schemaDefinitionsTagName: Schemas 
    generateCodeSamples:
      languages:  
        - lang: curl
        - lang: Node.js
        - lang: JavaScript
