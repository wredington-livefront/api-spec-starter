type: object
title: "User"
description: "Complete user representation"
properties:
  id:
    type: string
    format: uuid
    description: "Unique user identifier"
  username:
    type: string
    description: "Unique username for login"
  email:
    type: string
    format: email
    description: "User's email address"
  display_name:
    type: string
    description: "User's display name"
  avatar_url:
    type: string
    format: uri
    description: "URL to user's profile picture"
  bio:
    type: string
    description: "User biography/description"
  role:
    type: string
    enum: ["user", "moderator", "admin"]
    description: "User's role in the system"
  created_at:
    type: string
    format: date-time
    description: "Account creation timestamp"
  last_active_at:
    type: string
    format: date-time
    description: "Last activity timestamp"
  post_count:
    type: integer
    description: "Total number of posts by this user"