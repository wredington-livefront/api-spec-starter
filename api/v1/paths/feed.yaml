get:
  operationId: getFeed
  tags: [Feed]
  summary: Get feed
  description: Get the main content feed with post and author information
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: Content feed
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '../components/schemas/composite/FeedItem.yaml'
              total:
                type: integer
              limit:
                type: integer
              offset:
                type: integer