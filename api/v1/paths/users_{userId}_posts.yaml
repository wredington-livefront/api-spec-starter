parameters:
  - name: userId
    in: path
    required: true
    schema:
      type: string
      format: uuid

get:
  operationId: getUserPosts
  tags: [Posts, Users]
  summary: Get user posts
  description: Get all posts by a specific user
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: User's posts
      content:
        application/json:
          schema:
            $ref: '../components/schemas/composite/UserPosts.yaml'
    '404':
      description: User not found