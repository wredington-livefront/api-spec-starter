get:
  operationId: listUsers
  tags: [Users]
  summary: List users
  description: Get a paginated list of users
  parameters:
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: List of users
      content:
        application/json:
          schema:
            type: object
            properties:
              users:
                type: array
                items:
                  $ref: '../components/schemas/base/user/view/UserSummary.yaml'
              total:
                type: integer
              limit:
                type: integer
              offset:
                type: integer
    '400':
      description: Invalid input
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not found
    '500':
      description: Internal server error
post:
  operationId: createUser
  tags: [Users]
  summary: Create user
  description: Create a new user account
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/base/user/view/UserCreatePayload.yaml'
  responses:
    '201':
      description: User created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/base/user/User.yaml'
    '400':
      description: Invalid input
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not found
    '500':
      description: Internal server error